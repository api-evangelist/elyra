name: Elyra
description: >-
  Elyra is an AI-powered restaurant operations and reservation platform, backed by
  Y Combinator (Spring 2026 batch) and founded in Stockholm by Felix Odeberg Glasenapp
  and Alan Mando. The product combines an AI voice agent that answers reservation phone
  calls, an email concierge that handles confirmations and follow-ups, guest intelligence
  that builds diner profiles from preferences and booking history, smart table-allocation
  and walk-in optimization, plus analytics and campaign outreach tooling. It serves
  restaurant groups primarily across Scandinavia, addressing the roughly 40% of incoming
  calls restaurants miss and the booking delays that follow. Elyra operates as a
  business-facing SaaS application at app.elyrasystems.com and does not currently publish
  a public developer API, SDK, or developer portal.
